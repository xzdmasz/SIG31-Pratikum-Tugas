I<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #map {
            width: 1000px;
            height: 500px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <p><small>Klik dulu lokasi di peta, lalu isi nama dan tekan save.</small></p>
    <form action="process.php" method="post" id="formTitik">
        <label for="nama">Nama:</label>
        <input type="text" name="nama" id="nama" placeholder="Nama" required><br><br>
        <label for="lat">Latitude:</label>
        <input type="text" id="lat" name="lat" readonly><br><br>
        <label for="lng">Longitude:</label>
        <input type="text" id="lng" name="lng" readonly><br><br>
        <button type="submit">save</button>
        <button type="reset">reset</button>
    </form>
    <p id="pesan"></p>
    <script>
        let center = [-0.04078400978905354, 109.33484041034588];
        var peta = L.map('map').setView(center, 17);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(peta);

        // mmempersiapkan variabel untuk marker yang akan ditambahkan ke peta
        let marker;
        // mengambil koordinat dari marker
        peta.on('click', function (e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;

            //masukan kordinat ke dalam value untuk input koordinat di dalam form
            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;
            if (marker) {
                // jika marker sudah ada, hapus marker lama dari peta
                peta.removeLayer(marker);
                //tampilkan marker baru di peta
                marker = L.marker(e.latlng).addTo(peta);
            }

            else {
                // jika marker belum ada, buat marker baru dan tambahkan ke peta
                marker = L.marker(e.latlng).addTo(peta);
            }

        });

        // menampilkan pesan status setelah proses simpan
        var pesan = document.getElementById('pesan');
        var params = new URLSearchParams(window.location.search);
        var status = params.get('status');
        var alasan = {
            nama: 'Nama lokasi wajib diisi.',
            nama_panjang: 'Nama lokasi maksimal 64 karakter.',
            koordinat: 'Koordinat tidak valid. Klik dulu lokasi di peta.',
            db: 'Gagal menyimpan ke database. Cek koneksi database.'
        };

        if (status === 'ok') {
            pesan.textContent = 'Titik berhasil disimpan.';
        } else if (status === 'error') {
            pesan.textContent = alasan[params.get('reason')] || 'Gagal menyimpan titik.';
        }

        // cegah submit kalau belum klik peta
        document.getElementById('formTitik').addEventListener('submit', function (e) {
            if (document.getElementById('lat').value.trim() === '' ||
                document.getElementById('lng').value.trim() === '') {
                e.preventDefault();
                pesan.textContent = 'Klik dulu lokasi di peta supaya latitude dan longitude terisi.';
            }
        });

        // layer untuk titik-titik yang tersimpan di database
        // featureGroup dipakai karena punya getBounds() (layerGroup tidak punya)
        var titikLayer = L.featureGroup().addTo(peta);

        // memuat titik yang sudah tersimpan di database
        function muatTitik() {
            fetch('process.php?data=1')
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    data.features.forEach(function (feature) {
                        var lng = feature.geometry.coordinates[0];
                        var lat = feature.geometry.coordinates[1];
                        var nama = feature.properties.nama || '(tanpa nama)';

                        L.circleMarker([lat, lng], {
                            radius: 7,
                            color: '#1d4ed8',
                            weight: 2,
                            fillColor: '#3b82f6',
                            fillOpacity: 0.7
                        }).bindPopup(nama).addTo(titikLayer);
                    });

                    // geser/zoom peta supaya semua titik tersimpan terlihat
                    if (titikLayer.getLayers().length > 0) {
                        peta.fitBounds(titikLayer.getBounds(), {
                            padding: [40, 40],
                            maxZoom: 17
                        });
                    }
                })
                .catch(function (err) {
                    console.error('Gagal memuat titik:', err);
                });
        }

        muatTitik();

    </script>

</body>

</html>
